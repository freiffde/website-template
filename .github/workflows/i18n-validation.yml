name: 🌍 i18n Translation Validation

on:
  push:
    branches: [main, prod, develop]
    paths:
      - "frontend/i18n/locales/**"
      - "frontend/app/**/*.vue"
      - "frontend/scripts/validate-translations.js"
      - "frontend/scripts/check-unreferenced-translations.js"
      - "frontend/tests/i18n.test.js"
      - "frontend/tests/unreferenced-translations.test.js"
  pull_request:
    branches: [main, prod, develop]
    paths:
      - "frontend/i18n/locales/**"
      - "frontend/app/**/*.vue"
      - "frontend/scripts/validate-translations.js"
      - "frontend/scripts/check-unreferenced-translations.js"
      - "frontend/tests/i18n.test.js"
      - "frontend/tests/unreferenced-translations.test.js"

jobs:
  translation-validation:
    name: 🔍 Validate Translation Files
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: 📋 Install Dependencies
        run: npm ci

      - name: 🔍 Validate Translation Keys
        run: node scripts/validate-translations.js
        continue-on-error: false

      - name: 🔍 Check Unreferenced Translations
        run: node scripts/check-unreferenced-translations.js
        continue-on-error: false

      - name: 🧪 Run Translation Tests
        run: npm run test:i18n
        continue-on-error: false

      - name: 🧪 Run Unreferenced Translation Tests
        run: npm run test:unreferenced-i18n
        continue-on-error: false

      - name: 📊 Generate Translation Report
        if: always()
        run: |
          echo "## 🌍 Translation Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Translation Statistics" >> $GITHUB_STEP_SUMMARY
          node scripts/validate-translations.js 2>&1 | tail -n 10 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Unreferenced Translations Check" >> $GITHUB_STEP_SUMMARY
          node scripts/check-unreferenced-translations.js 2>&1 | tail -n 10 >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment PR with Results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Translation Validation Failed
              
              The translation files have issues that need to be fixed:
              
              - **Missing Keys**: Some translation keys are missing between languages
              - **Empty Translations**: Some translations are empty or missing values
              - **Unreferenced Keys**: Some translation keys exist but are not used in components
              
              **To fix these issues locally:**
              - Run \`npm run validate:i18n\` to check for missing/empty translations
              - Run \`npm run check:unreferenced-i18n\` to find unused translation keys
              - Run \`npm run test:i18n\` to run translation consistency tests
              - Run \`npm run test:unreferenced-i18n\` to test unreferenced detection
              - Run \`npm run precommit\` to run all translation checks
              
              Please fix all issues before merging.`
            })
